<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Order summary card</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <!-- main .Card -->
    <main class="card">
      <!-- Image Hero -->
      <img
        class="hero"
        src="./images/illustration-hero.svg"
        alt="Illustrated girl with headphones on dancing to music notes"
      />
      <div class="card-flexbox">
        <!-- Section Text Blurp -->
        <section class="text-blurb">
          <h1>Order Summary</h1>
          <p>
            You can now listen to millions of songs,<br />
            audiobooks, and podcasts on any device <br />
            anywhere you like!
          </p>
        </section>
        <section class="info-flexbox">
          <img
            class="music-icon"
            src="./images/icon-music.svg"
            alt=" Icon of a grey music note in a light purple circle"
          />
          <div class="annual-plan-flexbox">
            <p>Annual Plan</p>
            <p>$59.99/year</p>
          </div>
          <a href="#">Change</a>
        </section>
        <button class="button">Proceed to Payment</button>
        <a href="#">Cancel Order</a>
      </div>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Drucelle</a>.
    </footer>
  </body>
</html>
